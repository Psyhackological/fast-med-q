[project]
name = "fast-med-q"
version = "0.1.0"
description = "Be faster in medical queue! Modern safe and fast Python only."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.115.6",
    "fastapi-users[sqlalchemy]>=14.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = ["mypy>=1.14.1", "pylint>=3.3.3", "python-dotenv>=1.0.1", "ruff>=0.8.5"]
